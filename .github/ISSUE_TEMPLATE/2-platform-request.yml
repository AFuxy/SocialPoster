name: Platform Request
description: Request support for a new social network or authentication mode
labels: ["platform-request"]
body:
  - type: input
    id: network
    attributes:
      label: Social Network Name & URL
      placeholder: e.g. Threads (https://threads.net)
    validations:
      required: true

  - type: dropdown
    id: auth_method
    attributes:
      label: Authentication Method
      options:
        - OAuth 2.0
        - Personal Access Token / API Key
        - Webhook URL
        - Bot Token
        - Not sure
    validations:
      required: false

  - type: input
    id: api_docs
    attributes:
      label: Official API Documentation URL
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Notes & Media Requirements
      description: Mention character limits, image/video support, or API restrictions.
    validations:
      required: false
